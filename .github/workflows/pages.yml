name: Publish Archive RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  publish-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch WordPress API and generate Archive.xml
        run: |
          python <<'PYTHON'
          from __future__ import annotations

          import html
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from pathlib import Path
          from xml.sax.saxutils import escape

          api_url = (
              "https://newalbumreleases.net/wp-json/wp/v2/posts"
              "?categories=34"
              "&per_page=50"
              "&orderby=date"
              "&order=desc"
              "&_fields=id,date_gmt,link,title,excerpt"
          )

          encoded_api = urllib.parse.quote(api_url, safe="")

          sources = [
              ("Direct API", api_url),
              (
                  "AllOrigins",
                  "https://api.allorigins.win/raw?url=" + encoded_api,
              ),
              (
                  "CodeTabs",
                  "https://api.codetabs.com/v1/proxy?quest=" + encoded_api,
              ),
              (
                  "CorsProxy",
                  "https://corsproxy.io/?url=" + encoded_api,
              ),
          ]

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json,text/plain,*/*",
          }

          posts = None
          selected_source = None
          errors = []

          for source_name, source_url in sources:
              print(f"Trying {source_name}...")

              try:
                  request = urllib.request.Request(
                      source_url,
                      headers=headers,
                  )

                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                  if "Performing security verification" in raw:
                      raise RuntimeError(
                          "Cloudflare verification page returned"
                      )

                  data = json.loads(raw)

                  if not isinstance(data, list):
                      raise RuntimeError(
                          f"Expected a JSON list, received {type(data).__name__}"
                      )

                  if not data:
                      raise RuntimeError("The API returned no posts")

                  if "title" not in data[0] or "link" not in data[0]:
                      raise RuntimeError(
                          "The response does not contain WordPress posts"
                      )

                  posts = data
                  selected_source = source_name
                  print(
                      f"Success using {source_name}: "
                      f"{len(posts)} posts received."
                  )
                  break

              except Exception as error:
                  message = f"{source_name}: {type(error).__name__}: {error}"
                  errors.append(message)
                  print(message)
                  time.sleep(5)

          if posts is None:
              print("\nAll fetch methods failed:")
              for error in errors:
                  print(" -", error)

              raise RuntimeError(
                  "No route could retrieve the NewAlbumReleases WordPress API."
              )

          output = Path("public")
          output.mkdir(exist_ok=True)

          now = datetime.now(timezone.utc)
          items = []

          for post in posts:
              title = html.unescape(
                  post.get("title", {}).get("rendered", "")
              ).strip()

              link = post.get("link", "").strip()
              post_id = str(post.get("id", link))

              excerpt = post.get("excerpt", {}).get("rendered", "")
              excerpt = html.unescape(excerpt).strip()

              date_value = post.get("date_gmt")

              try:
                  published = datetime.fromisoformat(
                      date_value.replace("Z", "+00:00")
                  )

                  if published.tzinfo is None:
                      published = published.replace(tzinfo=timezone.utc)

                  pub_date = format_datetime(
                      published.astimezone(timezone.utc)
                  )

              except Exception:
                  pub_date = format_datetime(now)

              items.append(
                  f"""    <item>
                <title>{escape(title)}</title>
                <link>{escape(link)}</link>
                <guid isPermaLink="false">{escape(post_id)}</guid>
                <pubDate>{escape(pub_date)}</pubDate>
                <description><![CDATA[{excerpt}]]></description>
              </item>"""
              )

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:atom="http://www.w3.org/2005/Atom">
            <channel>
              <title>New Album Releases - Archive</title>
              <link>https://newalbumreleases.net/category/cat/</link>
              <description>Latest New Album Releases Archive posts</description>
              <language>en</language>
              <lastBuildDate>{escape(format_datetime(now))}</lastBuildDate>
              <generator>GitHub Actions via {escape(selected_source)}</generator>
              <atom:link
                href="https://pkashe.github.io/feeds/Archive.xml"
                rel="self"
                type="application/rss+xml" />
          {chr(10).join(items)}
            </channel>
          </rss>
          """

          rss = "\n".join(
              line.strip() for line in rss.splitlines()
          ) + "\n"

          (output / "Archive.xml").write_text(
              rss,
              encoding="utf-8",
          )

          (output / "index.html").write_text(
              """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>New Album Releases Archive RSS</title>
          </head>
          <body>
            <h1>New Album Releases Archive RSS</h1>
            <p><a href="Archive.xml">Open Archive.xml</a></p>
          </body>
          </html>
          """,
              encoding="utf-8",
          )

          (output / ".nojekyll").write_text("", encoding="utf-8")

          print(f"Generated Archive.xml with {len(posts)} posts.")
          PYTHON

      - name: Publish to gh-pages branch
        run: |
          cp -R public /tmp/generated-rss

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout gh-pages

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          cp -R /tmp/generated-rss/. .

          git add --all

          if git diff --cached --quiet; then
            echo "No RSS changes to publish."
          else
            git commit -m "Update Archive RSS"
            git push origin gh-pages
          fi
