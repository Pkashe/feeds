name: Publish Archive RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  publish-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Archive page through Jina
        run: |
          mkdir -p public

          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 180 \
            "https://r.jina.ai/http://newalbumreleases.net/category/cat/" \
            --output archive-page.txt

          test -s archive-page.txt

      - name: Generate Archive.xml
        run: |
          python <<'PYTHON'
          from __future__ import annotations

          import html
          import re
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from pathlib import Path
          from xml.sax.saxutils import escape

          source_file = Path("archive-page.txt")
          output_folder = Path("public")
          output_folder.mkdir(exist_ok=True)

          text = source_file.read_text(encoding="utf-8", errors="replace")

          # Find NewAlbumReleases article links in Jina's Markdown response.
          patterns = [
              re.compile(
                  r"\[([^\]\n]+)\]\((https?://newalbumreleases\.net/\d+/[^)\s]+/?)\)",
                  re.IGNORECASE,
              ),
              re.compile(
                  r"(https?://newalbumreleases\.net/\d+/([^\s)]+))",
                  re.IGNORECASE,
              ),
          ]

          entries: list[tuple[str, str]] = []
          seen_links: set[str] = set()

          for match in patterns[0].finditer(text):
              title = html.unescape(match.group(1)).strip()
              link = match.group(2).strip()

              if link in seen_links:
                  continue

              if title.lower() in {"download", "read more", "image"}:
                  continue

              seen_links.add(link)
              entries.append((title, link))

          # Fallback when links are not formatted as normal Markdown links.
          if not entries:
              for match in patterns[1].finditer(text):
                  link = match.group(1).strip()

                  if link in seen_links:
                      continue

                  slug = match.group(2).strip("/").replace("-", " ")
                  title = slug.title()

                  seen_links.add(link)
                  entries.append((title, link))

          if not entries:
              print("First 2,000 characters returned by Jina:")
              print(text[:2000])
              raise RuntimeError(
                  "No NewAlbumReleases article links were found in the downloaded page."
              )

          # Keep the newest page entries and avoid an excessively large feed.
          entries = entries[:50]

          now = datetime.now(timezone.utc)
          last_build_date = format_datetime(now)

          items: list[str] = []

          for title, link in entries:
              safe_title = escape(title)
              safe_link = escape(link)

              items.append(
                  f"""    <item>
                <title>{safe_title}</title>
                <link>{safe_link}</link>
                <guid isPermaLink="true">{safe_link}</guid>
                <description><![CDATA[{title}]]></description>
              </item>"""
              )

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:atom="http://www.w3.org/2005/Atom">
            <channel>
              <title>New Album Releases - Archive</title>
              <link>https://newalbumreleases.net/category/cat/</link>
              <description>Latest posts from the New Album Releases Archive page</description>
              <language>en</language>
              <lastBuildDate>{escape(last_build_date)}</lastBuildDate>
              <atom:link
                href="https://pkashe.github.io/feeds/Archive.xml"
                rel="self"
                type="application/rss+xml" />
          {chr(10).join(items)}
            </channel>
          </rss>
          """

          rss = "\n".join(line.strip() for line in rss.splitlines()) + "\n"

          (output_folder / "Archive.xml").write_text(
              rss,
              encoding="utf-8",
          )

          index_html = """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>New Album Releases Archive RSS</title>
          </head>
          <body>
            <h1>New Album Releases Archive RSS</h1>
            <p><a href="Archive.xml">Open Archive.xml</a></p>
          </body>
          </html>
          """

          (output_folder / "index.html").write_text(
              index_html,
              encoding="utf-8",
          )

          (output_folder / ".nojekyll").write_text("", encoding="utf-8")

          print(f"Generated Archive.xml with {len(entries)} entries.")
          PYTHON

      - name: Publish to gh-pages branch
        run: |
          cp -R public /tmp/generated-rss

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout gh-pages

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          cp -R /tmp/generated-rss/. .

          git add --all

          if git diff --cached --quiet; then
            echo "No RSS changes to publish."
          else
            git commit -m "Update Archive RSS"
            git push origin gh-pages
          fi
