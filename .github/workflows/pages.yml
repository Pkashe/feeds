name: Publish Archive RSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Archive.xml"
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-archive-rss
  cancel-in-progress: true

jobs:
  publish-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Archive.xml
        run: |
          if [ ! -f "Archive.xml" ]; then
            echo "Archive.xml was not found in the main branch."
            exit 1
          fi

          if ! grep -q "<rss" "Archive.xml"; then
            echo "Archive.xml does not appear to be a valid RSS file."
            exit 1
          fi

          if ! grep -q "<item" "Archive.xml"; then
            echo "Archive.xml does not contain any RSS items."
            exit 1
          fi

          echo "Archive.xml is available and contains RSS items."

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p /tmp/generated-rss

          cp Archive.xml /tmp/generated-rss/Archive.xml

          cat > /tmp/generated-rss/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>New Album Releases Archive RSS</title>
          </head>
          <body>
            <h1>New Album Releases Archive RSS</h1>
            <p>
              <a href="Archive.xml">Open Archive.xml</a>
            </p>
          </body>
          </html>
          HTML

          touch /tmp/generated-rss/.nojekyll

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          cp -R /tmp/generated-rss/. .

          git add --all

          if git diff --cached --quiet; then
            echo "No RSS changes to publish."
          else
            git commit -m "Publish Archive RSS"
            git push origin gh-pages
          fi
