name: Monthly Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update activity timestamp
        run: |
          date -u +"Last automated activity: %Y-%m-%dT%H:%M:%SZ" > .repository-activity

      - name: Commit activity timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .repository-activity
          git commit -m "Monthly repository activity"
          git push origin main
